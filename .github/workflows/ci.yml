name: Go

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/compat/go.sum
            tools/parsercompat/go.sum
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: Windows installer regression tests (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/install_test.ps1
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/conmesh --version
      - run: go run ./cmd/conmesh --help
      - run: go run ./cmd/conmesh doctor
      - name: SQLite persistence and MCP stdio compatibility
        working-directory: tools/compat
        run: go test -v ./...
      - name: Compatibility vet
        working-directory: tools/compat
        run: go vet ./...

  vulncheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/compat/go.sum
            tools/parsercompat/go.sum
      # Version-pinned through the Go module proxy and checksum database.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  native-parser:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/parsercompat/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/compat/go.sum
            tools/parsercompat/go.sum
      - name: Select Windows runner C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            $compilerDirs = @('C:/mingw64/bin', 'C:/msys64/mingw64/bin', 'C:/msys64/ucrt64/bin')
            $compilerDir = $compilerDirs | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
            if (-not $compilerDir) { throw 'Runner has no supported GCC toolchain' }
            $compilerDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Compiler provenance
        run: go env CC CGO_ENABLED GOOS GOARCH
      - name: TypeScript and CSharp grammar ABI and parse tests
        working-directory: tools/parsercompat
        run: go test -v ./...
      - name: Parser vet
        working-directory: tools/parsercompat
        run: go vet ./...
      - name: Native production Core tests
        run: go test -timeout 180s ./...
      - name: Native production vet
        run: go vet ./...
      - name: Native production build
        run: go build ./...
      - name: Race checks
        if: runner.os == 'Linux'
        run: go test -race -timeout 180s ./...
